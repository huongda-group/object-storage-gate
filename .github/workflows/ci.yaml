name: CI
on:
  push:
    branches:
      - master
      - main
  pull_request:
  # Lets the publish workflow gate on this one instead of shipping an untested tag.
  workflow_call:

env:
  RUST_TOOLCHAIN: stable
  TOOLCHAIN_PROFILE: minimal

jobs:
  rustfmt:
    name: Check Style
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      # --all-targets so tests/ is linted too; CLAUDE.md and README both prescribe it and CI
      # never ran it.
      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery -W rust-2018-idioms

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      # Một backend đỏ không được giết hai backend kia — cần thấy hết mới chẩn được.
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        # Set health checks to wait until postgres has started
        options: --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: mysql_test
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umysql -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Was `npm install` against a repo that only has pnpm-lock.yaml, on a node-version read
      # from a matrix that defines only `db`, so CI resolved dependency versions the image
      # never used and ran on whatever node the runner defaulted to.
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend
      - name: Frontend lint
        run: pnpm biome check
        working-directory: ./frontend
      - name: Frontend typecheck
        run: pnpm exec tsc --noEmit
        working-directory: ./frontend
      - name: Frontend tests
        run: pnpm vitest run
        working-directory: ./frontend
      - name: Build frontend
        run: pnpm build
        working-directory: ./frontend
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Pick DATABASE_URL for ${{ matrix.db }}
        run: |
          case "${{ matrix.db }}" in
            sqlite)   echo "DATABASE_URL=sqlite::memory:" >> "$GITHUB_ENV" ;;
            postgres) echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres_test" >> "$GITHUB_ENV" ;;
            mysql)    echo "DATABASE_URL=mysql://mysql:mysql@localhost:3306/mysql_test" >> "$GITHUB_ENV" ;;
          esac
      - name: Run cargo test
        run: cargo test --all-features --all
          

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      checks: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
