name: Publish image

on:
  push:
    tags:
      # Bare version tags, no leading "v": 0.1.0, 1.2.3
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0 or dev)"
        required: true

env:
  # Repo name on Docker Hub; the namespace is the DOCKERHUB_USERNAME account.
  IMAGE_NAME: object-storage-gate

jobs:
  # A tag pushed from a branch that never passed CI used to ship an image and move `latest`.
  verify:
    name: Tests must pass first
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Build and push
    needs: [verify]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      # arm64 is built under QEMU emulation — the Rust release build takes far
      # longer than the native amd64 one. Drop linux/arm64 below if that cost
      # outweighs having the arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # Only a plain release tag moves `latest`. The tag filter is
            # "[0-9]+.[0-9]+.[0-9]+*", whose trailing star also matches 0.2.0-rc1, and a
            # release candidate must not become what everyone pulls by default.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
