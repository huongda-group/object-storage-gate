[workspace]

[package]
name = "object-storage-gate"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "object_storage_gate-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "sqlx-mysql",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
include_dir = { version = "0.7" }
axum-extra = { version = "0.10", features = ["form"] }
aes-gcm = { version = "0.10", features = ["std"] }
base64 = "0.22"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
percent-encoding = "2.3.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12.1"
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
md-5 = "0.11.0"

[[bin]]
name = "object_storage_gate-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
futures-util = "0.3.34"
bytes = "1.12.1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
chrono = "0.4"
axum-test = "17"
percent-encoding = "2.3.2"
