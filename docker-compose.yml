# Base stack: app only. Không có database — chọn một overlay trong docker-compose/:
#
#   docker compose -f docker-compose.yml -f docker-compose/postgres.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose/mysql.yml    up -d
#   docker compose -f docker-compose.yml -f docker-compose/sqlite.yml   up -d
#
# Hoặc đặt COMPOSE_FILE trong .env rồi chạy `docker compose up -d` trống.
#
# auto_migrate đã tắt trên production. Chạy migration như một bước riêng trước khi rollout:
#   docker compose run --rm app object_storage_gate-cli db migrate
#
# Valkey quay lại ở đây vì audit worker đã đọc REDIS_URL thật. P2 gỡ nó ra đúng lúc không code
# nào dùng — một Redis chạy không ai đọc chỉ làm người vận hành tin rằng queue đã bền.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5150:5150"
    environment:
      # DATABASE_URL do overlay database cung cấp.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OSG_MASTER_KEY: ${OSG_MASTER_KEY:?set OSG_MASTER_KEY (base64 of 32 random bytes)}
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST, e.g. https://osg.example.com}
      REDIS_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "object_storage_gate-cli", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Running it revealed this: `cargo loco start` serves HTTP and nothing else, so with
  # workers.mode = BackgroundQueue the audit entries pile up in Redis and the table stays empty.
  # A separate worker process is what drains them; the app image is the same, only the command
  # differs.
  worker:
    build: .
    restart: unless-stopped
    command: ["object_storage_gate-cli", "start", "--worker"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OSG_MASTER_KEY: ${OSG_MASTER_KEY:?set OSG_MASTER_KEY (base64 of 32 random bytes)}
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST, e.g. https://osg.example.com}
      REDIS_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy

  # --appendonly yes is deliberate: an audit entry sitting in the queue when Valkey restarts is
  # exactly what the queue exists not to lose.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  valkeydata:
