# Base stack: app only. Không có database — chọn một overlay trong docker-compose/:
#
#   docker compose -f docker-compose.yml -f docker-compose/postgres.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose/mysql.yml    up -d
#   docker compose -f docker-compose.yml -f docker-compose/sqlite.yml   up -d
#
# Hoặc đặt COMPOSE_FILE trong .env rồi chạy `docker compose up -d` trống.
#
# auto_migrate đã tắt trên production. Chạy migration như một bước riêng trước khi rollout:
#   docker compose run --rm app object_storage_gate-cli db migrate
#
# Redis/Valkey từng nằm ở đây nhưng không code nào đọc REDIS_URL, nên nó chỉ đốt bộ nhớ và
# một volume trong khi làm người vận hành tin rằng queue đã bền và có distributed lock. Nó
# quay lại ở slice cắm queue thật — xem docs/superpowers/plans/2026-08-17-go-live-roadmap.md.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5150:5150"
    environment:
      # DATABASE_URL do overlay database cung cấp.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OSG_MASTER_KEY: ${OSG_MASTER_KEY:?set OSG_MASTER_KEY (base64 of 32 random bytes)}
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST, e.g. https://osg.example.com}
    healthcheck:
      test: ["CMD", "object_storage_gate-cli", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
